services:
  postgres:
    image: postgres:16
    container_name: water-supply-postgres
    environment:
      POSTGRES_DB: water_supply
      POSTGRES_USER: water_app
      POSTGRES_PASSWORD: water_app_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U water_app -d water_supply"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
